[project]
name = "viyog"
dynamic = ["version"]
description = "Training-free, gradient-free detector that separates adversarial (ADV) from out-of-distribution (OOD) inputs via first-layer dormant-band roughness."
readme = "README.md"
authors = [{ name = "Aman Singh", email = "singh052001aman@gmail.com" }]
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = [
    "out-of-distribution",
    "ood-detection",
    "adversarial-detection",
    "robustness",
    "safety",
    "pytorch",
    "deep-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.23",
]

[project.optional-dependencies]
metrics = ["scikit-learn>=1.1"]

[project.urls]
Homepage = "https://github.com/amanyagami/viyog"
Repository = "https://github.com/amanyagami/viyog"
Documentation = "https://viyog.readthedocs.io"
Demo = "https://huggingface.co/spaces/amanyagami/viyog"
Issues = "https://github.com/amanyagami/viyog/issues"
Changelog = "https://github.com/amanyagami/viyog/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/viyog/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/viyog"]

[tool.hatch.build.targets.sdist]
include = ["src/viyog", "README.md", "LICENSE"]

[dependency-groups]
dev = ["pre-commit>=4.2.0", "pytest>=8.4.0", "ruff>=0.11.12", "scikit-learn>=1.1"]
experiments = [
    "fvcore>=0.1.5",
    "gdown>=6.1",
    "h5py>=3.16",
    "huggingface-hub>=1.14",
    "matplotlib>=3.10",
    "nvidia-ml-py>=12.0",
    "onnxruntime>=1.20",
    "pandas>=2.3",
    "pillow>=12.0",
    "pytorch-ood>=0.3.2",
    "scipy>=1.15",
    "seaborn>=0.13",
    "timm>=1.0.27",
    "torchattacks>=3.5.1",
    "torchvision>=0.20",
    "tqdm>=4.68",
    "transformers>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".git", ".ruff_cache", ".venv", ".vscode"]

[tool.ruff.lint]
preview = true
select = [
    "ANN", # type annotation
    "B",   # flake8-bugbear
    "D",   # pydocstyle
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "PTH", # use `pathlib.Path` instead of `os.path`
    "RUF", # ruff specific rules
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "ANN401", # Checks that function arguments are annotated with a more specific type than Any.
    "B007",   # Unused loop variable
    "B008",   # Function call in default argument
    "B905",   # `zip()` without `strict=True`
    "COM812", # Missing trailing comma
    "COM819", # Trailing comma prohibited
    "D1",     # Missing docstring in public module, class, function, or method
    "D203",   # One blank line required before class docstring (ignored because D211 is prioritized in pydocstyle convention 'google')
    "D205",   # 1 blank line required between summary line and description
    "D212",   # Multi-line docstring summary should start at the first line
    "D213",   # Multi-line docstring summary should start at the second line
    "D400",   # First line of docstring should end with a period
    "D415",   # First line of docstring should end with punctuation (period, question mark, or exclamation point)
    "E114",   # Indentation is not a multiple of four (comment)
    "G004",   # Logging statement uses f-string
    "ISC001", # Implicit string concatenation on a single line
    "ISC002", # Implicit string concatenation on multiple lines
    "PTH123", # `open()` should be replaced by `Path.open()`
    "Q000",   # Single quotes found when double quotes are preferred
    "Q001",   # Single quotes found when double quotes are preferred for multi-line strings
    "Q002",   # Single quotes found when double quotes are preferred for docstrings
    "RUF002", # Checks for ambiguous Unicode characters in docstrings.
    "RUF003", # Checks for ambiguous Unicode characters in comments.
    "SIM105", # try-except-pass blocks that can be replaced with the contextlib.suppress context manager.
    "SIM108", # Use ternary operator instead of `if`-`else`-block
    "SIM116", # Use a dictionary instead of consecutive `if` statements
]
unfixable = [
    "F401", # unused import
    "F841", # unused variable
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"
