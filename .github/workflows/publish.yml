name: Publish to PyPI

# Publishes on every version tag (e.g. `git tag v0.1.1 && git push --tags`).
# Uses PyPI Trusted Publishing (OIDC) — no API token stored in the repo.
# One-time setup: on pypi.org -> your project -> Publishing, add a trusted
# publisher with owner=<you>, repo=viyog, workflow=publish.yml, environment=pypi.

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run tests
        run: uv run --frozen pytest -q

      - name: Build sdist + wheel
        run: uv build

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
